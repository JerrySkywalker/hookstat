[package]
name = "hookstat"
version = "0.2.1"
edition = "2024"
rust-version = "1.97.1"
description = "Reliability analytics for hooks across coding-agent runtimes"
license = "MIT"
repository = "https://github.com/JerrySkywalker/hookstat"
readme = "README.md"
keywords = ["hooks", "reliability", "agents", "codex", "tui"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
ratatui = "0.30"
crossterm = "0.29"
jerry-terminal-ui = { git = "https://github.com/JerrySkywalker/jerry-terminal-ui", rev = "75eea801a0a2c8f6f72d344da796b847710673f2" }
unicode-segmentation = "1"
unicode-width = "0.2"
chrono = "0.4"
sys-locale = "0.3"

[dev-dependencies]
tempfile = "3"
chrono-tz = "0.10"

[target.'cfg(windows)'.dependencies]
win32job = "2.0.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
