[package]
name = "hookstat"
version = "0.3.0"
edition = "2024"
rust-version = "1.97.1"
description = "Reliability analytics for hooks across coding-agent runtimes"
license = "MIT"
repository = "https://github.com/JerrySkywalker/hookstat"
readme = "README.md"
keywords = ["hooks", "reliability", "agents", "codex", "tui"]
categories = ["command-line-utilities", "development-tools"]

[workspace]
members = ["crates/hookstat-ipc-client", "crates/hookstat-hook"]
resolver = "2"

[features]
# Developer-only G28 measurement laboratory. This feature is never enabled by
# HookStat's ordinary binary or by its hook execution path.
performance-harness = []

[dependencies]
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
same-file = "1.0.6"
toml = "0.9"
ratatui = "0.30"
crossterm = "0.29"
terminal-ui-contract = "=0.1.0"
unicode-segmentation = "1"
unicode-width = "0.2"
chrono = "0.4"
sys-locale = "0.3"
interprocess = "2.4.3"
hookstat-ipc-client = { path = "crates/hookstat-ipc-client" }

[dev-dependencies]
tempfile = "3"
chrono-tz = "0.10"

[target.'cfg(windows)'.dependencies]
interprocess = { version = "2.4.3", features = ["tokio"] }
tokio = { version = "1.36", features = ["io-util", "net", "rt", "time"] }
win32job = "2.0.3"
widestring = "1.2.1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29.0", features = ["socket"] }

[[bin]]
name = "hookstat-perf"
path = "src/bin/hookstat_perf.rs"
required-features = ["performance-harness"]
test = false
bench = false

[[bin]]
name = "hookstat-hook-fixture"
path = "src/bin/hookstat_hook_fixture.rs"
required-features = ["performance-harness"]
test = false
bench = false

[[bin]]
name = "hookstat-g28-handler-fixture"
path = "src/bin/hookstat_g28_handler_fixture.rs"
required-features = ["performance-harness"]
test = false
bench = false

[[bin]]
name = "hookstat-ipc-qualify"
path = "src/bin/hookstat_ipc_qualify.rs"
required-features = ["performance-harness"]
test = false
bench = false

[[bin]]
name = "hookstat-ipc-collector-ab"
path = "src/bin/hookstat_ipc_collector_ab.rs"
required-features = ["performance-harness"]
test = false
bench = false

[[bin]]
name = "hookstat-ipc-stage-timing"
path = "src/bin/hookstat_ipc_stage_timing.rs"
required-features = ["performance-harness"]
test = false
bench = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
