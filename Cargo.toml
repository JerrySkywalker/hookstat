[package]
name = "hookstat"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Reliability analytics for hooks across coding-agent runtimes"
license = "MIT"
repository = "https://github.com/JerrySkywalker/hookstat"
readme = "README.md"
keywords = ["hooks", "reliability", "agents", "codex", "tui"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
ratatui = "0.30"
crossterm = "0.29"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
