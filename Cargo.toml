[[bin]]
name = "hookstat-shim-fixture"
path = "src/bin/hookstat_shim_fixture.rs"
required-features = ["test-fixtures"]
test = false
bench = false

[[test]]
name = "hook_shim_e2e"
path = "tests/hook_shim_e2e.rs"
required-features = ["test-fixtures"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
