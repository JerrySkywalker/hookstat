[package]
name = "hookstat-hook"
version = "0.3.0"
edition = "2024"
rust-version = "1.97.1"
description = "Private minimal transparent HookStat IPC shim"
license = "MIT"
publish = false

[[bin]]
name = "hookstat-hook-fixture"
path = "src/bin/hookstat_hook_fixture.rs"
test = false
bench = false

[dependencies]
hookstat-ipc-client = { path = "../hookstat-ipc-client" }
hmac = "0.12"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
win32job = "2.0.3"

[dev-dependencies]
interprocess = "2.4.3"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
